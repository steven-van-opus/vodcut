<!doctype html>
<!-- README hero for /vodcut. Original art only.
     Render: node docs/render.mjs still --html docs/hero.html --out docs/hero.png --width 1200 --height 640 --scale 2 --transparent -->
<html>
<head>
<meta charset="utf-8">
<title>/vodcut hero</title>
<style>
  :root { --ink: #0B1020; --panel: #101830; --teal: #19E3C4; --amber: #FFB020; --coral: #FF5A5F; --sky: #6FD3FF; --chalk: #F4F1EA; }
  html, body { margin: 0; background: transparent; }
  .card { position: relative; width: 1200px; height: 640px; border-radius: 36px; overflow: hidden;
          background: radial-gradient(circle at 78% 30%, #1D3B6E 0%, #121D3D 45%, var(--ink) 100%);
          font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: var(--chalk); }
  .prompt { position: absolute; left: 64px; top: 70px; font: 700 26px/1 Menlo, Consolas, monospace; color: rgba(244,241,234,.55); }
  .cmd { position: absolute; left: 60px; top: 112px; font: 800 112px/1 Menlo, Consolas, monospace; color: var(--teal); letter-spacing: -0.02em; }
  .cmd span { display: inline-block; width: 52px; height: 96px; background: var(--amber); vertical-align: -10px; margin-left: 10px; }
  .tag { position: absolute; left: 66px; top: 262px; font-size: 30px; font-weight: 700; }
  .tag b { color: var(--amber); }
  .steps { position: absolute; left: 66px; top: 330px; font: 600 22px/1.75 Menlo, Consolas, monospace; color: rgba(244,241,234,.85); }
  .steps i { font-style: normal; color: var(--teal); margin-right: 12px; }
  .steps em { font-style: normal; color: var(--amber); }
  #wave { position: absolute; left: 0; bottom: 0; width: 1200px; height: 120px; }
  .cards { position: absolute; left: 710px; top: 92px; width: 450px; height: 400px; }
  .card3 { position: absolute; width: 140px; height: 248px; }
  .phone { position: absolute; inset: 0; border-radius: 22px; border: 5px solid var(--chalk); overflow: hidden;
           box-shadow: 0 18px 40px rgba(0,0,0,.45); background: var(--ink); }
  .phone .top { height: 40%; background: linear-gradient(135deg, #3B2A8C, #19E3C4); position: relative; }
  .phone .top::after { content: ""; position: absolute; left: 50%; top: 56%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: var(--ink); }
  .phone .bot { height: 60%; background: linear-gradient(#C2477E, #FF8A3D 60%, #FFC24A); position: relative; }
  .phone .bot::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 0; height: 0; margin-left: -56px;
                       border-left: 56px solid transparent; border-right: 56px solid transparent; border-bottom: 84px solid #1A1E33; }
  .phone .cap { position: absolute; left: 22%; right: 22%; top: 38%; height: 14px; border-radius: 7px;
                background: linear-gradient(90deg, #FFFFFF 0 55%, #FFD23F 55% 100%); box-shadow: 0 0 0 3px var(--ink); }
  .num { position: absolute; left: -22px; top: -30px; font: 800 54px/1 "Avenir Next", Arial, sans-serif; color: var(--amber);
         -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); z-index: 2; }
  .chip { position: absolute; left: 10px; bottom: 10px; font: 700 15px/1 Menlo, monospace; background: rgba(11,16,32,.8);
          border-radius: 8px; padding: 6px 8px; color: var(--chalk); }
  .p3 { left: 0; top: 110px; transform: rotate(-8deg); }
  .p2 { left: 152px; top: 62px; transform: rotate(-2deg); }
  .p1 { left: 304px; top: 110px; transform: rotate(6deg); }
  .p1 .phone { border-color: var(--teal); }
  #slate { position: absolute; right: 22px; top: 6px; width: 170px; transform: rotate(8deg); }
  .aip { position: absolute; right: 56px; top: 478px; font: 700 20px/1 Menlo, monospace; color: var(--ink); background: var(--teal);
         padding: 10px 16px; border-radius: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="prompt">&gt; claude</div>
  <div class="cmd">/vodcut<span></span></div>
  <div class="tag">watches the <b>whole</b> VOD, so you don't</div>
  <div class="steps">
    <div><i>✓</i>scan every hour of the stream</div>
    <div><i>✓</i>rank the loudest reactions</div>
    <div><i>✓</i>verify them on frame sheets</div>
    <div><i>✓</i>cut + frame <em>1080×1920</em></div>
  </div>
  <div class="cards">
    <div class="card3 p3"><div class="phone"><div class="top"></div><div class="bot"></div><div class="cap"></div><div class="chip">▶ 0:34</div></div><div class="num">#3</div></div>
    <div class="card3 p2"><div class="phone"><div class="top"></div><div class="bot"></div><div class="cap"></div><div class="chip">▶ 0:28</div></div><div class="num">#2</div></div>
    <div class="card3 p1"><div class="phone"><div class="top"></div><div class="bot"></div><div class="cap"></div><div class="chip">▶ 0:41</div></div><div class="num">#1</div></div>
  </div>
  <div class="aip">→ opened in AI Producer</div>
  <img id="slate" src="src/mascot.svg" alt="">
  <svg id="wave" viewBox="0 0 1200 120" preserveAspectRatio="none"></svg>
</div>
<script>
  // A loudness strip across a whole stream: deterministic pseudo-random bars, three peaks marked #3 #2 #1.
  const svg = document.getElementById('wave');
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const peaks = { 23: 3, 61: 2, 97: 1 };
  let out = '';
  for (let i = 0; i < 120; i++) {
    const x = 10 + i * 9.9;
    const p = peaks[i];
    const h = p ? 92 : 14 + rnd() * 46 + (rnd() > 0.92 ? 18 : 0);
    const color = p ? '#19E3C4' : 'rgba(244,241,234,0.22)';
    out += `<rect x="${x}" y="${116 - h}" width="6" height="${h}" rx="3" fill="${color}"/>`;
    if (p) out += `<text x="${x + 3}" y="${116 - h - 8}" text-anchor="middle" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#FFB020">#${p}</text>`;
  }
  svg.innerHTML = out;
  window.__ready = true;
</script>
</body>
</html>
