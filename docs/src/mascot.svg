<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -10 372 312" width="372" height="312">
  <!-- "Slate", the gtavi-aiproducer mascot: an original clapperboard character. Palette: ink #0B1020/#141B33,
       teal #19E3C4, amber #FFB020, coral #FF5A5F, sky #6FD3FF, chalk #F4F1EA. -->
  <defs>
    <pattern id="slate-stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="26" fill="#FFB020"/>
      <rect x="13" width="13" height="26" fill="#0B1020"/>
    </pattern>
    <linearGradient id="slate-lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19E3C4"/>
      <stop offset="0.55" stop-color="#6FD3FF"/>
      <stop offset="1" stop-color="#FF5A5F"/>
    </linearGradient>
    <linearGradient id="slate-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2547"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <linearGradient id="slate-horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#19E3C4"/>
      <stop offset="1" stop-color="#11B79E"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="289" rx="92" ry="9" fill="#0B1020" opacity="0.22"/>
  <!-- legs + sneakers -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round">
    <rect x="104" y="246" width="24" height="34" rx="9" fill="#141B33"/>
    <rect x="172" y="246" width="24" height="34" rx="9" fill="#141B33"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">
    <path d="M92,279 h40 a10,10 0 0 1 10,10 v1 h-60 v-1 a10,10 0 0 1 10,-10z" fill="#19E3C4"/>
    <path d="M168,279 h40 a10,10 0 0 1 10,10 v1 h-60 v-1 a10,10 0 0 1 10,-10z" fill="#19E3C4"/>
  </g>
  <!-- left arm, waving -->
  <path d="M66,176 q-34,-2 -42,-36" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <path d="M66,176 q-34,-2 -42,-36" fill="none" stroke="#141B33" stroke-width="14" stroke-linecap="round"/>
  <circle cx="24" cy="134" r="14" fill="#141B33" stroke="#FFFFFF" stroke-width="6"/>
  <!-- right arm holding the megaphone -->
  <path d="M234,182 q34,0 38,-40" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"/>
  <path d="M234,182 q34,0 38,-40" fill="none" stroke="#141B33" stroke-width="14" stroke-linecap="round"/>
  <g transform="rotate(-32 268 120)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round">
    <path d="M250,104 l40,-22 v76 l-40,-22z" fill="url(#slate-horn)"/>
    <rect x="232" y="106" width="22" height="32" rx="6" fill="#FFB020"/>
    <rect x="288" y="78" width="10" height="84" rx="5" fill="#FF5A5F"/>
  </g>
  <g transform="rotate(-32 268 120)" fill="none" stroke="#FFB020" stroke-width="5" stroke-linecap="round">
    <path d="M308,92 q10,28 0,56"/>
    <path d="M322,82 q16,38 0,76" opacity="0.7"/>
  </g>
  <!-- body -->
  <rect x="58" y="108" width="184" height="148" rx="24" fill="url(#slate-body)" stroke="#FFFFFF" stroke-width="10"/>
  <!-- fixed clapper bar -->
  <rect x="58" y="90" width="184" height="30" rx="7" fill="url(#slate-stripes)" stroke="#FFFFFF" stroke-width="8"/>
  <!-- open clapper bar -->
  <g transform="rotate(-17 66 92)">
    <rect x="58" y="54" width="188" height="30" rx="7" fill="url(#slate-stripes)" stroke="#FFFFFF" stroke-width="8"/>
  </g>
  <circle cx="66" cy="90" r="10" fill="#FFB020" stroke="#FFFFFF" stroke-width="5"/>
  <!-- shades -->
  <g stroke="#0B1020" stroke-width="4" stroke-linejoin="round">
    <path d="M84,146 h58 v8 c0,24 -12,34 -29,34 c-17,0 -29,-10 -29,-34z" fill="url(#slate-lens)"/>
    <path d="M158,146 h58 v8 c0,24 -12,34 -29,34 c-17,0 -29,-10 -29,-34z" fill="url(#slate-lens)"/>
  </g>
  <rect x="140" y="148" width="20" height="7" rx="3" fill="#0B1020"/>
  <path d="M93,154 h15 l-12,18z" fill="#FFFFFF" opacity="0.75"/>
  <path d="M167,154 h15 l-12,18z" fill="#FFFFFF" opacity="0.75"/>
  <!-- grin -->
  <path d="M116,208 q34,30 68,0 q-34,12 -68,0z" fill="#FFFFFF" stroke="#0B1020" stroke-width="3" stroke-linejoin="round"/>
  <!-- chalk -->
  <g font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F4F1EA" opacity="0.5">
    <text x="78" y="244">CLIP 01</text>
    <text x="176" y="244">TAKE 1</text>
  </g>
</svg>
